name: Publish to npm and the MCP Registry

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      # Pinned on purpose, and its Sigstore bundle is checked below. Move it on deliberately.
      MCP_PUBLISHER_VERSION: v1.8.6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Check the tag matches the version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }

      - name: Install dependencies
        run: npm ci

      # The tests also check that every manifest carries the same version.
      - name: Test
        run: npm test

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Into the runner's temp folder, so nothing is added to the checkout.
      - name: Download and verify mcp-publisher
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      # The registry looks the version up on npm, and npm can take a minute to serve a version
      # it has just accepted. Until then the registry answers 400.
      - name: Wait for npm to serve this version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for check in $(seq 1 40); do
            if [ "$(npm view "makersmcp@$version" version --prefer-online 2>/dev/null)" = "$version" ]; then
              echo "npm serves makersmcp@$version (check $check)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm has not served makersmcp@$version for 10 minutes, so the MCP Registry was not updated."
          exit 1

      # io.github.MakersMCP is a GitHub namespace: the registry takes this job's OIDC token,
      # which id-token: write gives, so no secret is needed. It reads server.json, whose
      # versions npm test holds to package.json, and mcpName in package.json.
      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
